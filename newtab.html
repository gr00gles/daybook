<!doctype html>
<html lang="en" data-phase="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="sky">
  <div class="sky-inner">
    <section class="when" aria-label="Time and date">
      <p class="greeting" id="greeting">Hello</p>
      <p class="clock"><span id="clock-time"></span><span class="ampm" id="clock-ampm"></span></p>
      <p class="date-line"><span id="date-long"></span><span class="date-meta" id="date-meta"></span></p>
      <p class="holiday-line" id="holiday-line" hidden></p>
      <div class="next-up" id="next-up" hidden></div>
    </section>

    <section class="finder">
      <form class="search" id="search-form" role="search">
        <label class="search-box">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg>
          <input id="search-input" type="search" placeholder="Search Google" autocomplete="off" spellcheck="false" aria-label="Search">
          <kbd title="Press / to search">/</kbd>
        </label>
        <div class="places pop" id="places" hidden></div>
        <div class="engines" id="engines" role="radiogroup" aria-label="Search with"></div>
      </form>
      <nav class="shortcuts" id="shortcuts" aria-label="Shortcuts" data-section="shortcuts"></nav>
    </section>

    <section class="now-weather" aria-label="Weather now" data-section="weather">
      <div id="now-weather"></div>
      <button class="nw-alert" id="nw-alert" type="button" hidden></button>
      <div class="moon" id="moon"></div>
    </section>
  </div>
  <div class="toolbar">
    <button class="icon-btn" id="refresh-btn" type="button" title="Refresh everything" aria-label="Refresh everything"></button>
    <button class="icon-btn" id="settings-btn" type="button" title="Settings" aria-label="Settings"></button>
  </div>
</header>

<main class="board">
  <div class="col col-day">
    <section class="card" id="card-today" data-section="calendar" aria-labelledby="today-h">
      <header class="card-head">
        <h2 id="today-h">Today</h2>
        <span class="head-meta" id="today-date"></span>
        <button class="btn small add-event" type="button" id="add-event"></button>
      </header>
      <div class="card-body" id="today-body"><p class="quiet">Loading your calendars…</p></div>
      <footer class="card-foot">
        <span class="stamp" id="today-updated"></span>
      </footer>
    </section>

    <section class="card" id="card-month" data-section="calendar" aria-labelledby="month-title">
      <header class="card-head month-head">
        <h2 id="month-title">Month</h2>
        <span class="stamp" id="month-status"></span>
        <div class="month-nav">
          <button class="btn small" type="button" id="month-today" data-month="today" hidden>Today</button>
          <button class="icon-btn small" type="button" id="month-prev" data-month="prev" aria-label="Previous month"></button>
          <button class="icon-btn small" type="button" id="month-next" data-month="next" aria-label="Next month"></button>
        </div>
      </header>
      <div class="card-body" id="month-body"></div>
    </section>
  </div>

  <div class="col col-mail">
    <section class="card" id="card-mail" data-section="mail" aria-labelledby="mail-h">
      <header class="card-head">
        <h2 id="mail-h">Unread <span class="head-count" id="mail-count"></span></h2>
        <span class="stamp" id="mail-updated"></span>
      </header>
      <div class="card-body" id="mail-body"><p class="quiet">Checking your inboxes…</p></div>
      <footer class="card-foot"><div class="foot-links" id="mail-links"></div></footer>
    </section>

    <section class="card" id="card-youtube" data-section="youtube" aria-labelledby="yt-h">
      <header class="card-head">
        <h2 id="yt-h">YouTube <span class="head-count" id="yt-count"></span></h2>
        <span class="stamp" id="yt-updated"></span>
      </header>
      <div class="card-body" id="yt-body"><p class="quiet">Checking your subscriptions…</p></div>
      <footer class="card-foot"><div class="foot-links" id="yt-foot"></div></footer>
    </section>

    <section class="card" id="card-notes" data-section="notes" aria-labelledby="notes-h">
      <header class="card-head">
        <h2 id="notes-h">Notes</h2>
        <span class="stamp" id="notes-state"></span>
      </header>
      <textarea id="notes" class="notes" maxlength="6000" placeholder="Jot something down. It syncs with your Chrome profile." aria-labelledby="notes-h"></textarea>
    </section>
  </div>

  <div class="col col-out">
    <section class="card" id="card-weather" data-section="weather" aria-labelledby="weather-h">
      <header class="card-head">
        <h2 id="weather-h">Weather</h2>
        <span class="head-meta" id="weather-place"></span>
        <span class="stamp" id="weather-updated"></span>
      </header>
      <div class="wx-alerts" id="wx-alerts" data-section="alerts"></div>
      <div class="card-body" id="weather-body"><p class="quiet">Getting the forecast…</p></div>
    </section>

    <section class="card" id="card-stocks" data-section="stocks" aria-labelledby="stocks-h" hidden>
      <header class="card-head">
        <h2 id="stocks-h">Markets</h2>
        <span class="head-meta" id="stocks-state"></span>
        <span class="stamp" id="stocks-updated"></span>
      </header>
      <div class="card-body" id="stocks-body"><p class="quiet">Getting quotes…</p></div>
      <p class="credit">Quotes by <a href="https://finnhub.io/">Finnhub</a></p>
    </section>

    <section class="card" id="card-news" data-section="news" aria-labelledby="news-h">
      <header class="card-head">
        <h2 id="news-h">Headlines</h2>
        <span class="stamp" id="news-updated"></span>
      </header>
      <div class="tabs" id="news-tabs" role="tablist" aria-label="Headline topics"></div>
      <div class="card-body" id="news-body"><p class="quiet">Loading headlines…</p></div>
    </section>
  </div>
</main>

<div class="update-bar pop" id="update-bar" role="status" hidden></div>
<div class="toast pop" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="settings" class="sheet" aria-label="Settings"></dialog>
<dialog id="welcome" class="welcome" aria-label="Set up Daybook"></dialog>
<dialog id="event-dialog" class="event-dialog" aria-labelledby="ev-h"></dialog>
<dialog id="mail-dialog" class="mail-dialog" aria-labelledby="rd-subject"></dialog>
</body>
</html>
